<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

      property="og:description"
      content="Há mais de 30 anos fornecendo blocos, lajotas e canaletas com o melhor preço da região. Faça seu orçamento em 1 minuto pelo WhatsApp."
    />

    <meta property="og:url" content="https://ceramicafriburgo.com.br" />

    <meta property="og:image" content="https://ceramicafriburgo.com.br/preview.jpg" />

    <!-- Deixa a prévia igual de boa no Twitter/X também -->

      name="twitter:description"
