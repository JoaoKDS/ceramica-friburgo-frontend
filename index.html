<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cerâmica Friburgo — Blocos, lajotas e canaletas cerâmicas em Campinas/SP. Há mais de 30 anos fornecendo material de qualidade. Faça seu orçamento em 1 minuto pelo WhatsApp."
    />
    <title>Cerâmica Friburgo | Blocos e Lajotas Cerâmicas em Campinas</title>
    <meta name="theme-color" content="#b34700" />

    <!-- ===== OPEN GRAPH (prévia ao compartilhar no WhatsApp, Facebook, etc) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cerâmica Friburgo | Blocos e Lajotas Cerâmicas em Campinas" />
    <meta
      property="og:description"
      content="Há mais de 30 anos fornecendo blocos, lajotas e canaletas com o melhor preço da região. Faça seu orçamento em 1 minuto pelo WhatsApp."
    />
    <!-- IMPORTANTE: troque pela URL final do site depois do deploy -->
    <meta property="og:url" content="https://ceramicafriburgo.com.br" />
    <!-- IMPORTANTE: precisa ser uma URL completa (https://...), não um caminho relativo -->
    <meta property="og:image" content="https://ceramicafriburgo.com.br/preview.jpg" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Deixa a prévia igual de boa no Twitter/X também -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cerâmica Friburgo | Blocos e Lajotas Cerâmicas em Campinas" />
    <meta
      name="twitter:description"
      content="Blocos, lajotas e canaletas cerâmicas com entrega em Campinas/SP. Orçamento rápido pelo WhatsApp."
    />
    <meta name="twitter:image" content="https://ceramicafriburgo.com.br/preview.jpg" />

    <!-- ===== SEO LOCAL: dados da empresa para o Google (não aparece na tela) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HomeAndConstructionBusiness",
        "name": "Cerâmica Friburgo",
        "description": "Fabricação e venda de blocos cerâmicos, blocos estruturais, lajotas e canaletas para construção civil, com entrega em Campinas e região.",
        "telephone": "+55-19-3266-0508",
        "email": "olariafriburgo@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Res. São José",
          "addressLocality": "Campinas",
          "addressRegion": "SP",
          "addressCountry": "BR"
        },
        "areaServed": { "@type": "City", "name": "Campinas" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "07:00",
            "closes": "16:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
